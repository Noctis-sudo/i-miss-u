<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFB6C1">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="一张用心准备的约会邀请卡">
<title>我很想你，你能跟我出去玩嘛</title>
<style>
/* =========================================================
   全局与配色（粉彩色系 / 卡通手绘感）
   ========================================================= */
:root{
  --pink:#FF9CB0;
  --pink-deep:#F5809A;
  --pink-soft:#FFD6E0;
  --pink-bg:#FFF0F5;
  --lav:#C9B6E4;
  --lav-soft:#E8DFF7;
  --mint:#9FE0C4;
  --mint-soft:#D9F5E9;
  --sky:#A9D6FF;
  --sky-soft:#DCEEFF;
  --cream:#FFF2CC;
  --ink:#5A4A52;
  --ink-soft:#8B7A82;
  --card:#FFFFFF;
  --radius:24px;
  --shadow:0 10px 28px rgba(255,156,176,.24);
  --shadow-soft:0 4px 16px rgba(140,120,140,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,#FFF0F5 0%,#F6ECFF 48%,#E8F4FF 100%);
  background-attachment:fixed;
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* 背景漂浮爱心装饰 */
.bg-deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.bg-deco span{position:absolute;opacity:.5;animation:floaty 6s ease-in-out infinite;}
.bg-deco span:nth-child(1){left:6%;top:12%;animation-delay:0s;}
.bg-deco span:nth-child(2){right:8%;top:22%;animation-delay:1.2s;}
.bg-deco span:nth-child(3){left:12%;bottom:18%;animation-delay:2.1s;}
.bg-deco span:nth-child(4){right:14%;bottom:10%;animation-delay:.7s;}
.bg-deco span:nth-child(5){left:48%;top:6%;animation-delay:1.7s;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-14px) rotate(4deg);}}

/* =========================================================
   布局
   ========================================================= */
.app{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;
  padding:18px 16px calc(30px + env(safe-area-inset-bottom));
  min-height:100vh;
  display:flex;flex-direction:column;
}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:24px;}
.brand{font-size:13px;color:var(--ink-soft);letter-spacing:.5px;display:flex;align-items:center;gap:6px;}
.stepcount{font-size:12px;color:var(--ink-soft);}

/* 进度指示 */
.progress{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 18px;opacity:0;transition:opacity .3s;height:0;overflow:hidden;}
.progress.show{opacity:1;height:auto;margin:2px 0 18px;}
.dot{width:9px;height:9px;border-radius:50%;background:#E9E0EA;transition:all .3s ease;position:relative;}
.dot.active{background:var(--pink);transform:scale(1.5);box-shadow:0 0 0 4px rgba(255,156,176,.18);}
.dot.done{background:var(--mint);}

.screen{display:none;flex:1;flex-direction:column;}
.screen.active{display:flex;animation:fadeUp .45s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* =========================================================
   卡片
   ========================================================= */
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:24px 20px;
  box-shadow:var(--shadow);
  position:relative;
}
.card + .card{margin-top:16px;}
.card-title{
  font-size:19px;font-weight:800;margin:0 0 4px;
  display:flex;align-items:center;gap:8px;
}
.card-sub{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}

/* 主视觉插画 */
.hero{display:flex;justify-content:center;margin:4px 0 10px;position:relative;}
.hero .heartbig{animation:beat 1.6s ease-in-out infinite;transform-origin:center;}
@keyframes beat{0%,100%{transform:scale(1);}18%{transform:scale(1.12);}36%{transform:scale(1);}54%{transform:scale(1.08);}}
.hero-cat{position:absolute;bottom:-2px;}

/* 开场文案 */
.title-big{
  font-size:24px;font-weight:900;text-align:center;line-height:1.45;margin:14px 0 10px;
  letter-spacing:.5px;
}
.title-big .hl{color:var(--pink-deep);}
.intro-text{
  font-size:15px;color:var(--ink);text-align:center;white-space:pre-wrap;
  margin:0 0 6px;line-height:1.85;
}

/* 按钮 */
.btn{
  display:block;width:100%;border:none;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:800;letter-spacing:1px;
  color:#fff;padding:15px 18px;border-radius:999px;
  background:linear-gradient(135deg,#FFA8BC 0%,#FF8BA7 60%,#F5809A 100%);
  box-shadow:0 8px 18px rgba(245,128,154,.36);
  transition:transform .12s ease, box-shadow .12s ease, background .2s;
  -webkit-appearance:none;appearance:none;
}
.btn:active{transform:scale(.96);box-shadow:0 3px 10px rgba(245,128,154,.32);}
.btn:disabled{opacity:.6;filter:grayscale(.15);}
.btn.ghost{
  background:#fff;color:var(--pink-deep);
  border:2px solid var(--pink-soft);box-shadow:var(--shadow-soft);
}
.btn.ghost:active{background:#FFF6F9;}
.btn.mint{background:linear-gradient(135deg,#A8E8CE,#87D9B7);box-shadow:0 8px 18px rgba(135,217,183,.36);}
.btn-row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;}
.btn-row .btn{flex:1;min-width:120px;}

/* 不愿意按钮（躲避用） */
#noBtn{transition:transform .28s cubic-bezier(.34,1.56,.64,1), font-size .2s, opacity .3s;will-change:transform;}

/* =========================================================
   选项卡片
   ========================================================= */
.opt-list{display:flex;flex-direction:column;gap:12px;}
.opt{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:18px;cursor:pointer;
  background:#fff;border:2.5px solid #F1E9EE;
  box-shadow:var(--shadow-soft);
  transition:transform .12s ease,border-color .2s,background .2s;
  user-select:none;
}
.opt:active{transform:scale(.975);}
.opt .ic{flex:0 0 auto;width:42px;height:42px;display:flex;align-items:center;justify-content:center;}
.opt .txt{flex:1;min-width:0;}
.opt .name{font-size:15.5px;font-weight:700;}
.opt .desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.opt .tick{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  border:2.5px solid #E9DFE6;display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.opt .tick svg{opacity:0;transform:scale(.4);transition:all .2s ease;}
.opt.multi .tick{border-radius:9px;}
.opt.sel{border-color:var(--pink);background:linear-gradient(135deg,#FFF5F8,#FFEDF3);}
.opt.sel .tick{background:var(--pink);border-color:var(--pink);}
.opt.sel .tick svg{opacity:1;transform:scale(1);}

/* 自定义输入 */
.opt.custom-input{border-style:dashed;border-color:#E3D6E0;}
.opt.custom-input.sel{border-style:solid;border-color:var(--pink);}
.custom-field{margin-top:12px;display:none;animation:fadeUp .3s ease both;}
.custom-field.show{display:block;}
.custom-field input{
  width:100%;padding:13px 16px;border-radius:16px;border:2.5px solid #F1E9EE;
  font-family:inherit;font-size:15px;color:var(--ink);background:#FFFCFE;outline:none;
  transition:border-color .2s;
}
.custom-field input:focus{border-color:var(--pink);}
textarea{
  width:100%;min-height:110px;resize:vertical;padding:14px 16px;border-radius:18px;
  border:2.5px solid #F1E9EE;font-family:inherit;font-size:15px;color:var(--ink);
  background:#FFFCFE;outline:none;transition:border-color .2s;line-height:1.7;
}
textarea:focus{border-color:var(--pink);}

/* 底部操作栏 */
.footer{margin-top:auto;padding-top:20px;}
.footer .btn-row{margin-top:0;}

/* 提示条 */
.notice{
  font-size:12.5px;color:var(--ink-soft);background:#FFF9FC;border:1.5px dashed #F3DDE6;
  border-radius:14px;padding:10px 14px;margin-top:14px;line-height:1.7;
}
.notice b{color:var(--pink-deep);}

/* =========================================================
   确认卡
   ========================================================= */
.confirm-card{
  background:linear-gradient(160deg,#FFF6FA 0%,#FDF1FF 55%,#F2F6FF 100%);
  border-radius:var(--radius);padding:0;overflow:hidden;
  box-shadow:var(--shadow);border:2px solid #fff;
  animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.confirm-head{
  padding:22px 20px 16px;text-align:center;
  background:linear-gradient(135deg,#FFB6C8,#FFA0BC);
  color:#fff;
}
.confirm-head .ct{font-size:20px;font-weight:900;letter-spacing:1px;}
.confirm-head .cs{font-size:12.5px;opacity:.92;margin-top:4px;}
.confirm-body{padding:18px 20px 22px;}
.crow{display:flex;gap:10px;padding:10px 0;border-bottom:1.5px dashed #F0E4EC;align-items:flex-start;}
.crow:last-child{border-bottom:none;}
.crow .ck{flex:0 0 74px;font-size:13px;color:var(--ink-soft);font-weight:700;}
.crow .cv{flex:1;font-size:14.5px;font-weight:600;word-break:break-word;white-space:pre-wrap;}
.tag{
  display:inline-block;background:#FFEAF1;color:var(--pink-deep);
  border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;margin:2px 6px 2px 0;
}
.stamp{
  text-align:center;font-size:11.5px;color:var(--ink-soft);
  margin-top:14px;letter-spacing:1px;
}
.sign{
  text-align:center;font-size:13px;color:var(--pink-deep);font-weight:700;margin-top:6px;
}

/* 状态提示（复制成功 / 复制失败 / 一般提示） */
.status{
  display:none;margin-top:14px;padding:12px 16px;border-radius:16px;
  font-size:13.5px;font-weight:700;text-align:center;line-height:1.6;
}
.status.show{display:block;animation:fadeUp .3s ease both;}
.status.ok{background:var(--mint-soft);color:#2E8A63;}
.status.err{background:#FFE9EA;color:#D9534F;}
.status.info{background:var(--sky-soft);color:#3D7BB5;}

/* 复制按钮：轻微呼吸动效 + 复制成功态 */
.btn-copy{animation:btnPulse 1.8s ease-in-out infinite;}
.btn-copy.copied{
  background:linear-gradient(135deg,#A8E8CE,#87D9B7);
  box-shadow:0 8px 18px rgba(135,217,183,.36);
  animation:popOk .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes btnPulse{
  0%,100%{box-shadow:0 8px 18px rgba(135,217,183,.36);}
  50%{box-shadow:0 8px 26px rgba(135,217,183,.62);}
}
@keyframes popOk{from{transform:scale(.9);}60%{transform:scale(1.06);}to{transform:scale(1);}}

/* 手动复制兜底框（自动复制失败时，长按全选） */
.manual-box{display:none;margin-top:14px;}
.manual-box.show{display:block;animation:fadeUp .3s ease both;}
.manual-box .mb-tip{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:8px;}
.manual-box textarea{min-height:150px;font-size:13.5px;line-height:1.8;-webkit-user-select:text;user-select:text;}

/* 庆祝小爱心 */
.celebrate{text-align:center;margin:16px 0 4px;}
.celebrate span{display:inline-block;animation:popHeart .9s ease infinite alternate;font-size:0;}
.celebrate span:nth-child(2){animation-delay:.2s;}
.celebrate span:nth-child(3){animation-delay:.4s;}
@keyframes popHeart{from{transform:translateY(0) scale(.9);}to{transform:translateY(-8px) scale(1.1);}}

.hidden{display:none !important;}

/* =========================================================
   桌宠：固定在屏幕最底部的小图（点击穿透，不影响页面交互）
   动效 = 整体轻浮动 + 左右微摆，起止同帧，无缝循环
   ========================================================= */
.pet{
  position:fixed;
  left:auto;
  right:8px;
  right:max(8px, env(safe-area-inset-right, 0px));
  bottom:0px;
  bottom:calc(0px + env(safe-area-inset-bottom, 0px));
  width:min(110px, 18vw);
  z-index:5;
  pointer-events:none;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  transform:translateZ(0);
}
.pet img{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
  transform-origin:50% 100%;
  animation:petFloat 4.8s ease-in-out infinite;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
@keyframes petFloat{
  0%  {transform:translate3d(0,0,0) rotate(0deg) scale(1);}
  25% {transform:translate3d(-3px,-5px,0) rotate(-2.2deg) scale(1.01);}
  50% {transform:translate3d(0,-9px,0) rotate(0deg) scale(1.02);}
  75% {transform:translate3d(3px,-5px,0) rotate(2.2deg) scale(1.01);}
  100%{transform:translate3d(0,0,0) rotate(0deg) scale(1);}
}
/* 用户系统偏好「减少动态效果」时保持静止，仅不做动画 */
@media (prefers-reduced-motion: reduce){
  .pet img{animation:none;}
}
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-deco" aria-hidden="true">
  <span id="d1"></span><span id="d2"></span><span id="d3"></span>
  <span id="d4"></span><span id="d5"></span>
</div>

<div class="app">

  <div class="topbar">
    <div class="brand" id="brandText"></div>
    <div class="stepcount" id="stepCount"></div>
  </div>

  <div class="progress" id="progress">
    <span class="dot" data-step="1"></span>
    <span class="dot" data-step="2"></span>
    <span class="dot" data-step="3"></span>
    <span class="dot" data-step="4"></span>
    <span class="dot" data-step="5"></span>
  </div>

  <!-- ========== 步骤 0：开场邀请 ========== -->
  <section class="screen active" data-screen="0">
    <div class="card">
      <div class="hero">
        <div id="heroArt"></div>
      </div>
      <h1 class="title-big" id="titleBig"></h1>
      <p class="intro-text" id="introText"></p>
      <div class="btn-row" style="flex-direction:column;gap:14px;">
        <button class="btn" id="yesBtn" type="button"></button>
        <button class="btn ghost" id="noBtn" type="button"></button>
      </div>
      <div class="notice" id="openNotice" style="display:none;"></div>
    </div>
  </section>

  <!-- ========== 步骤 1：选择时间 ========== -->
  <section class="screen" data-screen="1">
    <div class="card">
      <h2 class="card-title"><span id="t1"></span><span id="t1text"></span></h2>
      <p class="card-sub" id="s1text"></p>
      <div class="opt-list" id="timeList"></div>
      <div class="custom-field" id="timeCustomField">
        <input type="text" id="timeCustomInput" placeholder="你想定什么时间都可以，为了你我啥时候都有空" autocomplete="off">
      </div>
    </div>
    <div class="footer">
      <div class="btn-row">
        <button class="btn ghost" type="button" data-back="0" style="flex:0 0 96px;">上一步</button>
        <button class="btn" type="button" id="toStep2">下一步</button>
      </div>
    </div>
  </section>

  <!-- ========== 步骤 2：选择地点 ========== -->
  <section class="screen" data-screen="2">
    <div class="card">
      <h2 class="card-title"><span id="t2"></span><span id="t2text"></span></h2>
      <p class="card-sub" id="s2text"></p>
      <div class="opt-list" id="placeList"></div>
      <div class="custom-field" id="placeCustomField">
        <input type="text" id="placeCustomInput" placeholder="想去别的地方？写在这里吧～" autocomplete="off">
      </div>
    </div>
    <div class="footer">
      <div class="btn-row">
        <button class="btn ghost" type="button" data-back="1" style="flex:0 0 96px;">上一步</button>
        <button class="btn" type="button" id="toStep3">下一步</button>
      </div>
    </div>
  </section>

  <!-- ========== 步骤 3：选择吃什么 ========== -->
  <section class="screen" data-screen="3">
    <div class="card">
      <h2 class="card-title"><span id="t3"></span><span id="t3text"></span></h2>
      <p class="card-sub" id="s3text"></p>
      <div class="opt-list" id="foodList"></div>
      <div class="custom-field" id="foodCustomField">
        <input type="text" id="foodCustomInput" placeholder="就嘴了吧！" autocomplete="off">
      </div>
    </div>
    <div class="footer">
      <div class="btn-row">
        <button class="btn ghost" type="button" data-back="2" style="flex:0 0 96px;">上一步</button>
        <button class="btn" type="button" id="toStep4">下一步</button>
      </div>
    </div>
  </section>

  <!-- ========== 步骤 4：留言备注 ========== -->
  <section class="screen" data-screen="4">
    <div class="card">
      <h2 class="card-title"><span id="t4"></span><span id="t4text"></span></h2>
      <p class="card-sub" id="s4text"></p>
      <textarea id="noteInput" placeholder="有什么想对我说的嘛"></textarea>
    </div>
    <div class="footer">
      <div class="btn-row">
        <button class="btn ghost" type="button" data-back="3" style="flex:0 0 96px;">上一步</button>
        <button class="btn" type="button" id="toStep5">下一步</button>
      </div>
    </div>
  </section>

  <!-- ========== 步骤 5：结果确认与复制到剪贴板 ========== -->
  <section class="screen" data-screen="5">
    <div class="confirm-card" id="confirmCard"></div>
    <div class="footer">
      <button class="btn mint btn-copy" type="button" id="copyBtn" style="margin-bottom:12px;">复制并发送给他 ♡</button>
      <button class="btn ghost" type="button" data-back="4" id="backToEdit">返回修改</button>
    </div>
    <div class="status" id="statusBox"></div>
    <div class="manual-box" id="manualBox">
      <div class="mb-tip">长按下面的文字，全选后复制，再发给他就好啦～</div>
      <textarea id="manualText" readonly></textarea>
    </div>
  </section>

</div>

<script>
/* =========================================================================
 *  CONFIG —— 所有可自定义内容都集中在这里，改这里就够了
 *  改完保存，重新上传到 GitHub Pages 即可生效
 * ========================================================================= */
var CONFIG = {

  /* ---------- 1. 称呼 ---------- */
  hostName:  "咕噜煲",          // 邀请人（你自己）的称呼，会出现在文案里
  guestName: "小三木",          // 被邀请人（她）的称呼

  /* ---------- 2. 开场文案 ---------- */
  inviteTitle: "有一件超重要的事\n想认真问问你",   // 开场大标题，\n 表示换行
  inviteIntro: "宝，我想跟你一起出去玩了，\n一起度过一个只属于我们俩的约会。\n\n如果没什么想干的话就去河边做喜欢做的事情吧❤️\n\n所以……愿意吗？", // 开场正文

  yesText: "愿意 ♡",            // 「愿意」按钮文字
  noText:  "不愿意…",           // 「不愿意」按钮初始文字

  // 点「不愿意」时依次冒出来的俏皮话（点一次换一句，按钮会躲开，页面不会结束）
  noTease: [
    "真的吗？再想一下嘛～",
    "啧 你咋这样呢",
    "那就当你是心动了一下下？",
    "按钮跑掉啦，抓不到我～",
    "看不见我看不见我"
  ],

  /* ---------- 3. 时间选项 ---------- */
  // 单选（可改 multi:true 变多选）；末尾会自动追加「其他时间」自定义输入项
  timeMulti: true,
  timeTitle: "你想什么时候见面？",
  timeSub: "选一个你最方便的时间，我提前安排～",
  timeOptions: [
    { key: "mon", name: "周一", desc: "一周的开始，也想从见你开始", icon: "calendar" },
    { key: "tue", name: "周二", desc: "平平淡淡的日子也想见你",     icon: "calendar" },
    { key: "wed", name: "周三", desc: "周中偷个小懒出来玩",         icon: "calendar" },
    { key: "thu", name: "周四", desc: "再熬一天就到周末啦",         icon: "calendar" },
    { key: "fri", name: "周五", desc: "放学，一起走嘛",       icon: "calendar" },
    { key: "sun", name: "周日", desc: "晚上偷偷溜出去呀",     icon: "calendar" }
  ],

  /* ---------- 4. 地点 / 项目选项 ---------- */
  // multi:true 表示可多选
  placeMulti: true,
  placeTitle: "想去哪里约会？",
  placeSub: "可以多选，想去的都勾上～",

/* =========================================================================
 *  工具函数
 * ========================================================================= */
function pad2(n){ return (n < 10 ? "0" : "") + n; }

// 本地时间格式化：YYYY-MM-DD HH:mm:ss
function formatLocalTime(d){
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate())
       + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}

function $(sel){ return document.querySelector(sel); }
function $all(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }

/* =========================================================================
 *  运行状态
 * ========================================================================= */
var state = {
  step: 0,
  time: null,          // 选中的时间（字符串）
  timeCustom: "",      // 自定义时间
  places: [],          // 选中的地点数组
  placeCustom: "",
  foods: [],
  foodCustom: "",
  note: ""
};

/* =========================================================================
 *  初始化页面（把 CONFIG 内容渲染到页面）
 * ========================================================================= */
function init(){
  document.title = CONFIG.pageTitle;

  // 顶部品牌
  $("#brandText").innerHTML = ICONS.heartSmall + '<span>' + escapeHtml(CONFIG.hostName) + ' 的专属邀请</span>';

  // 背景装饰
  var decoIds = ["d1","d2","d3","d4","d5"];
  for (var i = 0; i < decoIds.length; i++){
    var el = document.getElementById(decoIds[i]);
    if (el) el.innerHTML = ICONS.heartSmall;
  }

  // 开场页
  $("#heroArt").innerHTML = '<div class="heartbig">' + ICONS.heart + '</div><div class="hero-cat">' + ICONS.cat + '</div>';
  $("#titleBig").innerHTML = escapeHtml(CONFIG.inviteTitle).replace(/\n/g, "<br>").replace(/愿意吗|邀请/g, function(m){ return '<span class="hl">' + m + '</span>'; });
  $("#introText").textContent = CONFIG.inviteIntro;
  $("#yesBtn").textContent = CONFIG.yesText;
  $("#noBtn").textContent = CONFIG.noText;

  // 步骤标题
  $("#t1").innerHTML = ICONS.calendar;
  $("#t1text").textContent = CONFIG.timeTitle;
  $("#s1text").textContent = CONFIG.timeSub;

  $("#t2").innerHTML = ICONS.river;
  $("#t2text").textContent = CONFIG.placeTitle;
  $("#s2text").textContent = CONFIG.placeSub;

  $("#t3").innerHTML = ICONS.hotpot;
  $("#t3text").textContent = CONFIG.foodTitle;
  $("#s3text").textContent = CONFIG.foodSub;

  $("#t4").innerHTML = ICONS.note;
  $("#t4text").textContent = CONFIG.noteTitle;
  $("#s4text").textContent = CONFIG.noteSub;

  // 渲染选项列表
  renderList("timeList", CONFIG.timeOptions, "time", CONFIG.timeMulti);
  renderList("placeList", CONFIG.placeOptions, "place", CONFIG.placeMulti);
  renderList("foodList", CONFIG.foodOptions, "food", CONFIG.foodMulti);

  // 事件绑定
  bindEvents();
  updateProgress();
}

/* 渲染一个选项列表 */
function renderList(containerId, options, type, multi){
  var box = document.getElementById(containerId);
  if (!box) return;
  var html = "";
  for (var i = 0; i < options.length; i++){
    var o = options[i];
    html += '<div class="opt' + (multi ? ' multi' : '') + '" data-type="' + type + '" data-key="' + o.key + '">'
          +   '<div class="ic">' + (ICONS[o.icon] || ICONS.heartSmall) + '</div>'
          +   '<div class="txt"><div class="name">' + escapeHtml(o.name) + '</div>'
          +     (o.desc ? '<div class="desc">' + escapeHtml(o.desc) + '</div>' : '')
          +   '</div>'
          +   '<div class="tick">' + ICONS.check + '</div>'
          + '</div>';
  }
  // 自定义输入项
  html += '<div class="opt custom-input" data-type="' + type + '" data-key="__custom__">'
        +   '<div class="ic">' + ICONS.edit + '</div>'
        +   '<div class="txt"><div class="name">其他</div><div class="desc">实际上吃个嘴子也行嘛。。。</div></div>'
        +   '<div class="tick">' + ICONS.check + '</div>'
        + '</div>';
  box.innerHTML = html;
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* =========================================================================
 *  事件绑定
 * ========================================================================= */
function bindEvents(){
  // ---- 「愿意」按钮 ----
  $("#yesBtn").addEventListener("click", function(){
    goStep(1);
  });

  // ---- 「不愿意」按钮：趣味躲避，页面不会结束 ----
  var noBtn = $("#noBtn");
  var noCount = 0;
  noBtn.addEventListener("click", function(){
    noCount++;
    var tease = CONFIG.noTease;
    var msg = tease[Math.min(noCount - 1, tease.length - 1)];
    noBtn.textContent = msg;

    // 随机位移 + 逐渐缩小
    var rangeX = 70 + noCount * 14;
    var rangeY = 30 + noCount * 8;
    var x = (Math.random() * 2 - 1) * rangeX;
    var y = (Math.random() * 2 - 1) * rangeY;
    var scale = Math.max(1 - noCount * 0.12, 0.45);
    noBtn.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + scale.toFixed(2) + ")";

    // 点多了就淡出躲起来，但「愿意」依然在
    if (noCount >= 5){
      noBtn.style.opacity = "0.25";
      noBtn.style.pointerEvents = "none";
    }
    // 让「愿意」按钮轻轻放大，吸引点击
    var yesBtn = $("#yesBtn");
    yesBtn.style.transform = "scale(" + Math.min(1 + noCount * 0.03, 1.12) + ")";
    setTimeout(function(){ yesBtn.style.transform = "scale(1)"; }, 320);
  });

  // ---- 上一步按钮（通用） ----
  $all("[data-back]").forEach(function(btn){
    btn.addEventListener("click", function(){
      goStep(parseInt(btn.getAttribute("data-back"), 10));
    });
  });

  // ---- 选项点击（事件委托） ----
  document.addEventListener("click", function(e){
    var opt = e.target.closest ? e.target.closest(".opt") : null;
    if (!opt) return;
    handleOption(opt);
  });

  // ---- 下一步按钮 ----
  $("#toStep2").addEventListener("click", function(){ if (validateTime()) goStep(2); });
  $("#toStep3").addEventListener("click", function(){ if (validatePlace()) goStep(3); });
  $("#toStep4").addEventListener("click", function(){
    if (CONFIG.requireFood && state.foods.length === 0 && !state.foodCustom.trim()){
      toast("选一个想吃的吧，不然我会纠结的～", "err"); return;
    }
    goStep(4);
  });

  // ---- 自定义输入 ----
  $("#timeCustomInput").addEventListener("input", function(){ state.timeCustom = this.value; });
  $("#placeCustomInput").addEventListener("input", function(){ state.placeCustom = this.value; });
  $("#foodCustomInput").addEventListener("input", function(){ state.foodCustom = this.value; });
  $("#noteInput").addEventListener("input", function(){ state.note = this.value; });

  // ---- 进入确认页（在确认页上整理文案并复制发送） ----
  $("#toStep5").addEventListener("click", function(){
    if (!validateTime()){ goStep(1); return; }
    if (!validatePlace()){ goStep(2); return; }
    if (CONFIG.requireFood && state.foods.length === 0 && !state.foodCustom.trim()){ goStep(3); return; }
    goStep(5);
  });

  // ---- 确认页：复制到剪贴板 ----
  $("#copyBtn").addEventListener("click", doCopy);
}

/* 处理选项点击 */
function handleOption(opt){
  var type = opt.getAttribute("data-type");
  var key  = opt.getAttribute("data-key");
  var isCustom = (key === "__custom__");
  var multi = (type === "time") ? CONFIG.timeMulti
            : (type === "place") ? CONFIG.placeMulti
            : CONFIG.foodMulti;

  if (type === "time"){
    if (isCustom){
      state.time = null;
      $all('#timeList .opt').forEach(function(el){ el.classList.remove("sel"); });
      opt.classList.add("sel");
      $("#timeCustomField").classList.add("show");
      setTimeout(function(){ $("#timeCustomInput").focus(); }, 120);
    } else {
      state.time = key;
      if (!CONFIG.timeMulti){
        $all('#timeList .opt').forEach(function(el){ el.classList.remove("sel"); });
        opt.classList.add("sel");
        $("#timeCustomField").classList.remove("show");
        state.timeCustom = "";
      } else {
        opt.classList.toggle("sel");
        if (!opt.classList.contains("sel")) state.time = null;
      }
    }
    return;
  }

  if (type === "place"){
    if (isCustom){
      opt.classList.toggle("sel");
      $("#placeCustomField").classList.toggle("show", opt.classList.contains("sel"));
      if (!opt.classList.contains("sel")){ state.placeCustom = ""; $("#placeCustomInput").value = ""; }
      return;
    }
    toggleMulti(opt, multi, type);
    return;
  }

  if (type === "food"){
    if (isCustom){
      opt.classList.toggle("sel");
      $("#foodCustomField").classList.toggle("show", opt.classList.contains("sel"));
      if (!opt.classList.contains("sel")){ state.foodCustom = ""; $("#foodCustomInput").value = ""; }
      return;
    }
    toggleMulti(opt, multi, type);
    return;
  }
}

/* 多选 / 单选 切换，并同步 state */
function toggleMulti(opt, multi, type){
  if (!multi){
    var siblings = opt.parentNode.querySelectorAll(".opt");
    for (var i = 0; i < siblings.length; i++) siblings[i].classList.remove("sel");
    opt.classList.add("sel");
  } else {
    opt.classList.toggle("sel");
  }
  syncState(type);
}

/* 从 DOM 同步已选项到 state */
function syncState(type){
  var listId = type === "place" ? "placeList" : "foodList";
  var arr = [];
  $all("#" + listId + " .opt").forEach(function(el){
    if (el.classList.contains("sel") && el.getAttribute("data-key") !== "__custom__"){
      var k = el.getAttribute("data-key");
      var found = findOption(type === "place" ? CONFIG.placeOptions : CONFIG.foodOptions, k);
      if (found) arr.push(found.name);
    }
  });
  if (type === "place") state.places = arr;
  else state.foods = arr;
}

function findOption(list, key){
  for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
  return null;
}

/* =========================================================================
 *  步骤切换与校验
 * ========================================================================= */
function goStep(n){
  if (n === 5){
    // 每次进入确认页都重新渲染，并清空上一次的复制提示
    var st = $("#statusBox");
    if (st) st.className = "status";
    hideManualBox();
    renderConfirm(false);
  }

  state.step = n;

  $all(".screen").forEach(function(s){
    s.classList.toggle("active", parseInt(s.getAttribute("data-screen"), 10) === n);
  });
  window.scrollTo(0, 0);

  var progress = $("#progress");
  if (n >= 1){ progress.classList.add("show"); } else { progress.classList.remove("show"); }
  updateProgress();
  $("#stepCount").textContent = n >= 1 && n <= 5 ? ("第 " + n + " / 5 步") : "";
}

function updateProgress(){
  var cur = state.step;
  $all(".dot").forEach(function(d){
    var s = parseInt(d.getAttribute("data-step"), 10);
    d.classList.toggle("active", s === cur);
    d.classList.toggle("done", s < cur);
  });
}

function validateTime(){
  if (state.time || state.timeCustom.trim()) return true;
  toast("先选一个时间吧，我好提前准备～", "err");
  return false;
}
function validatePlace(){
  if (CONFIG.requirePlace && state.places.length === 0 && !state.placeCustom.trim()){
    toast("选一个想去的地方嘛～", "err");
    return false;
  }
  return true;
}

/* 简易提示（在页面顶部弹一条） */
function toast(msg, type){
  var box = document.getElementById("statusBox");
  if (!box) return;
  box.className = "status show " + (type || "info");
  box.textContent = msg;
  setTimeout(function(){ box.classList.remove("show"); }, 2600);
}

/* =========================================================================
 *  收集结果数据
 * ========================================================================= */
function collectResult(){
  var timeText = "";
  if (state.time){
    var t = findOption(CONFIG.timeOptions, state.time);
    timeText = t ? t.name : state.time;
  }
  if (state.timeCustom.trim()){
    timeText = timeText ? (timeText + " + " + state.timeCustom.trim()) : state.timeCustom.trim();
  }

  var places = state.places.slice();
  if (state.placeCustom.trim()) places.push(state.placeCustom.trim());

  var foods = state.foods.slice();
  if (state.foodCustom.trim()) foods.push(state.foodCustom.trim());

  var submitTime = formatLocalTime(new Date());

  return {
    guestName: CONFIG.guestName,
    hostName: CONFIG.hostName,
    time: timeText,
    places: places,
    foods: foods,
    note: state.note.trim(),
    submittedAt: submitTime
  };
}

/* =========================================================================
 *  复制到剪贴板（纯前端，无任何上报 / 存储）
 *  优先级：① navigator.clipboard.writeText
 *          ② 隐藏 textarea + document.execCommand("copy")（兼容微信内置浏览器 / iOS 旧内核）
 *          ③ 展示可长按全选的文本框，提示她手动长按复制
 * ========================================================================= */
function buildMessage(){
  var r = collectResult();

  var lines = [];
  lines.push("我答应你啦～♡");
  lines.push("");
  lines.push("时间：" + (r.time || "待定"));
  lines.push("地点：" + (r.places.length ? r.places.join("、") : "待定"));
  lines.push("吃什么：" + (r.foods.length ? r.foods.join("、") : "待定"));
  if (r.note) lines.push("想对你说：" + r.note);
  lines.push("");
  lines.push("—— " + r.guestName + " 回给 " + r.hostName);
  lines.push("（" + r.submittedAt + "）");
  return lines.join("\n");
}

function doCopy(){
  // 复制前再确认一次信息完整
  if (!validateTime()){ goStep(1); return; }
  if (!validatePlace()){ goStep(2); return; }
  if (CONFIG.requireFood && state.foods.length === 0 && !state.foodCustom.trim()){ goStep(3); return; }

  var msg = buildMessage();

  copyText(msg, function(ok){
    renderConfirm(ok);
    var btn = $("#copyBtn");
    if (ok){
      if (btn){ btn.classList.add("copied"); btn.textContent = "已复制 ✓"; }
      hideManualBox();
      showStatus("ok", "已复制！粘贴到微信发给他就行～");
    } else {
      if (btn){ btn.classList.remove("copied"); btn.textContent = "复制并发送给他 ♡"; }
      showStatus("info", "没能自动复制，长按下面的文字全选复制就好～");
      showManualBox(msg);
    }
  });
}

/* 复制：优先现代 API，失败降级 execCommand，再失败交给手动兜底框 */
function copyText(text, done){
  if (navigator.clipboard && navigator.clipboard.writeText){
    try {
      navigator.clipboard.writeText(text).then(function(){
        done(true);
      }).catch(function(){
        done(legacyCopy(text));
      });
      return;
    } catch(e){ /* 少数内核会同步抛错，继续走降级方案 */ }
  }
  done(legacyCopy(text));
}

/* 兼容微信内置浏览器 / iOS 的隐藏 textarea 方案 */
function legacyCopy(text){
  var ta = null;
  try {
    ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "readonly");
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "-9999px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);

    ta.focus();
    ta.select();
    if (ta.setSelectionRange) ta.setSelectionRange(0, ta.value.length);

    var ok = false;
    try { ok = document.execCommand("copy"); } catch(e){ ok = false; }

    if (ta.parentNode) ta.parentNode.removeChild(ta);
    return ok;
  } catch(e){
    if (ta && ta.parentNode) ta.parentNode.removeChild(ta);
    return false;
  }
}

/* 自动复制失败时，把文案放进可长按全选的显示框 */
function showManualBox(msg){
  var box = $("#manualBox");
  var ta = $("#manualText");
  if (!box || !ta) return;
  ta.value = msg;
  box.classList.add("show");
}
function hideManualBox(){
  var box = $("#manualBox");
  if (box) box.classList.remove("show");
}

function showStatus(type, msg){
  var box = $("#statusBox");
  if (!box) return;
  box.className = "status show " + type;
  box.textContent = msg;
}

/* =========================================================================
 *  渲染确认卡
 * ========================================================================= */
function renderConfirm(copied){
  var r = collectResult();

  function tags(arr, emptyText){
    if (!arr.length) return '<span style="color:#B9AEB5;">' + emptyText + '</span>';
    var s = "";
    for (var i = 0; i < arr.length; i++) s += '<span class="tag">' + escapeHtml(arr[i]) + '</span>';
    return s;
  }

  var head = copied
    ? '<div class="confirm-head"><div class="ct">复制好啦 ♡</div>'
      + '<div class="cs">' + escapeHtml(CONFIG.hostName) + ' × ' + escapeHtml(CONFIG.guestName) + ' · 粘贴到微信发给他就行～</div></div>'
    : '<div class="confirm-head"><div class="ct">约会确认卡</div>'
      + '<div class="cs">' + escapeHtml(CONFIG.hostName) + ' × ' + escapeHtml(CONFIG.guestName) + ' · 核对一下，复制发给他吧</div></div>';

  var html = ''
    + head
    + '<div class="confirm-body">'
    +   '<div class="crow"><div class="ck">时间</div><div class="cv">' + (r.time ? escapeHtml(r.time) : '<span style="color:#B9AEB5;">待定</span>') + '</div></div>'
    +   '<div class="crow"><div class="ck">地点</div><div class="cv">' + tags(r.places, "待定") + '</div></div>'
    +   '<div class="crow"><div class="ck">吃什么</div><div class="cv">' + tags(r.foods, "待定") + '</div></div>'
    +   '<div class="crow"><div class="ck">留言</div><div class="cv">' + (r.note ? escapeHtml(r.note) : '<span style="color:#B9AEB5;">（还没有留言）</span>') + '</div></div>'
    +   '<div class="celebrate"><span>' + ICONS.heartSmall + '</span><span>' + ICONS.heartSmall + '</span><span>' + ICONS.heartSmall + '</span></div>'
    +   '<div class="stamp">生成时间 ' + escapeHtml(r.submittedAt) + '</div>'
    +   '<div class="sign">—— 就等这一天啦 ♡</div>'
    + '</div>';

  $("#confirmCard").innerHTML = html;
}

/* 启动 */
init();
</script>
